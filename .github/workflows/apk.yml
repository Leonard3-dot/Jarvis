name: Construire Lisa (APK)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer le projet
        run: |
          mkdir -p www
          cp index.html www/
          cp sw.js www/ 2>/dev/null || true
          cp icon-*.png www/ 2>/dev/null || true
          if [ -f manifest.json ]; then cp manifest.json www/; else echo '{"name":"Lisa","short_name":"Lisa","start_url":".","display":"standalone","background_color":"#030610","theme_color":"#030610"}' > www/manifest.json; fi
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/speech-recognition@6
          npx cap init Lisa com.leonard.lisa --web-dir www
          npx cap add android
      - name: Ajouter le plugin Lisa (appels, SMS, WhatsApp)
        run: |
          mkdir -p $(dirname android/app/src/main/java/com/leonard/lisa/LisaBridge.java)
          cat > android/app/src/main/java/com/leonard/lisa/LisaBridge.java <<'EOF_BRIDGE'
          package com.leonard.lisa;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.provider.CallLog;
          import android.provider.Telephony;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "LisaBridge", permissions = {
              @Permission(strings = {Manifest.permission.READ_CALL_LOG}, alias = "calls"),
              @Permission(strings = {Manifest.permission.READ_SMS}, alias = "sms")})
          public class LisaBridge extends Plugin {
              private boolean has(String p) { return ContextCompat.checkSelfPermission(getContext(), p) == PackageManager.PERMISSION_GRANTED; }

              private JSObject state() {
                  JSObject o = new JSObject();
                  o.put("calls", has(Manifest.permission.READ_CALL_LOG));
                  o.put("sms", has(Manifest.permission.READ_SMS));
                  o.put("notif", NotificationManagerCompat.getEnabledListenerPackages(getContext()).contains(getContext().getPackageName()));
                  return o;
              }

              @PluginMethod public void status(PluginCall c) { c.resolve(state()); }
              @PluginMethod public void ask(PluginCall c) { requestAllPermissions(c, "done"); }
              @PermissionCallback private void done(PluginCall c) { c.resolve(state()); }

              @PluginMethod public void reply(PluginCall c) {
                  String to = c.getString("to", ""), text = c.getString("text", "");
                  if (to.isEmpty() || text.isEmpty()) { c.reject("vide"); return; }
                  if (LisaNotifService.reply(getContext(), to, text)) c.resolve(); else c.reject("introuvable");
              }

              @PluginMethod public void openNotifSettings(PluginCall c) {
                  Intent i = new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS");
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  c.resolve();
              }

              @PluginMethod public void report(PluginCall c) {
                  long since = c.getData().optLong("since", System.currentTimeMillis() - 86400000L);
                  JSArray calls = new JSArray(), sms = new JSArray(), wa = new JSArray(), gm = new JSArray();
                  try {
                      if (has(Manifest.permission.READ_CALL_LOG)) {
                          try (Cursor q = getContext().getContentResolver().query(CallLog.Calls.CONTENT_URI,
                                  new String[]{CallLog.Calls.NUMBER, CallLog.Calls.CACHED_NAME, CallLog.Calls.TYPE, CallLog.Calls.DATE},
                                  CallLog.Calls.DATE + ">?", new String[]{String.valueOf(since)}, CallLog.Calls.DATE + " DESC")) {
                              while (q != null && q.moveToNext()) {
                                  int t = q.getInt(2);
                                  if (t == CallLog.Calls.OUTGOING_TYPE) continue;
                                  JSObject o = new JSObject();
                                  String name = q.getString(1);
                                  o.put("name", name != null && !name.isEmpty() ? name : q.getString(0));
                                  o.put("type", t == CallLog.Calls.INCOMING_TYPE ? "in" : "missed");
                                  o.put("t", q.getLong(3));
                                  calls.put(o);
                              }
                          }
                      }
                      if (has(Manifest.permission.READ_SMS)) {
                          try (Cursor q = getContext().getContentResolver().query(Telephony.Sms.Inbox.CONTENT_URI,
                                  new String[]{Telephony.Sms.ADDRESS, Telephony.Sms.BODY, Telephony.Sms.DATE},
                                  Telephony.Sms.DATE + ">?", new String[]{String.valueOf(since)}, Telephony.Sms.DATE + " DESC")) {
                              while (q != null && q.moveToNext()) {
                                  JSObject o = new JSObject();
                                  o.put("from", q.getString(0));
                                  o.put("t", q.getLong(2));
                                  sms.put(o);
                              }
                          }
                      }
                      SharedPreferences sp = getContext().getSharedPreferences("lisa", Context.MODE_PRIVATE);
                      JSONArray a = new JSONArray(sp.getString("notifs", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject n = a.getJSONObject(i);
                          if (n.getLong("t") > since) { if ("gm".equals(n.optString("app", "wa"))) gm.put(new JSObject(n.toString())); else wa.put(new JSObject(n.toString())); }
                      }
                  } catch (Exception e) { c.reject(e.getMessage()); return; }
                  JSObject r = new JSObject();
                  r.put("calls", calls); r.put("sms", sms); r.put("wa", wa); r.put("gm", gm);
                  c.resolve(r);
              }
          }
          EOF_BRIDGE
          mkdir -p $(dirname android/app/src/main/java/com/leonard/lisa/LisaNotifService.java)
          cat > android/app/src/main/java/com/leonard/lisa/LisaNotifService.java <<'EOF_NOTIF'
          package com.leonard.lisa;

          import android.app.Notification;
          import android.app.RemoteInput;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import java.util.Iterator;
          import java.util.LinkedHashMap;
          import java.util.Map;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Mémorise sur l'appareil qui a écrit (WhatsApp : expéditeur ; Gmail : expéditeur et objet)
           *  et garde en mémoire vive la réponse rapide WhatsApp pour répondre sur ordre de l'utilisateur. */
          public class LisaNotifService extends NotificationListenerService {
              static final Map<String, Notification.Action> REPLY = new LinkedHashMap<>();

              static boolean reply(Context ctx, String to, String text) {
                  String key = null;
                  for (String k : REPLY.keySet()) if (k.toLowerCase().contains(to.toLowerCase())) key = k;
                  if (key == null) return false;
                  Notification.Action ac = REPLY.get(key);
                  try {
                      RemoteInput[] ri = ac.getRemoteInputs();
                      Bundle b = new Bundle();
                      for (RemoteInput r : ri) b.putCharSequence(r.getResultKey(), text);
                      Intent i = new Intent();
                      RemoteInput.addResultsToIntent(ri, i, b);
                      ac.actionIntent.send(ctx, 0, i);
                      REPLY.remove(key);
                      return true;
                  } catch (Exception e) { return false; }
              }

              @Override public void onNotificationPosted(StatusBarNotification sbn) {
                  String pkg = sbn.getPackageName(), app;
                  if ("com.whatsapp".equals(pkg) || "com.whatsapp.w4b".equals(pkg)) app = "wa";
                  else if ("com.google.android.gm".equals(pkg)) app = "gm";
                  else return;
                  Notification n = sbn.getNotification();
                  if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;
                  CharSequence title = n.extras.getCharSequence(Notification.EXTRA_TITLE);
                  if (title == null) return;
                  if ("wa".equals(app) && n.actions != null) {
                      for (Notification.Action ac : n.actions) {
                          if (ac.getRemoteInputs() != null && ac.getRemoteInputs().length > 0) {
                              REPLY.put(title.toString(), ac);
                              if (REPLY.size() > 30) { Iterator<String> it = REPLY.keySet().iterator(); it.next(); it.remove(); }
                              break;
                          }
                      }
                  }
                  try {
                      SharedPreferences sp = getSharedPreferences("lisa", Context.MODE_PRIVATE);
                      JSONArray a = new JSONArray(sp.getString("notifs", "[]")), b = new JSONArray();
                      JSONObject o = new JSONObject();
                      o.put("app", app);
                      o.put("from", title.toString());
                      o.put("t", sbn.getPostTime());
                      {
                          CharSequence tx = n.extras.getCharSequence(Notification.EXTRA_TEXT);
                          if (tx != null) o.put("s", tx.toString().substring(0, Math.min(160, tx.length())));
                      }
                      for (int i = Math.max(0, a.length() - 199); i < a.length(); i++) b.put(a.get(i));
                      b.put(o);
                      sp.edit().putString("notifs", b.toString()).apply();
                  } catch (Exception ignored) {}
              }
          }
          EOF_NOTIF
          mkdir -p $(dirname android/app/src/main/java/com/leonard/lisa/LisaPhone.java)
          cat > android/app/src/main/java/com/leonard/lisa/LisaPhone.java <<'EOF_PHONE'
          package com.leonard.lisa;

          import android.app.NotificationManager;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.provider.Settings;
          import android.database.Cursor;
          import android.provider.AlarmClock;
          import android.provider.ContactsContract;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          /** Contrôles du téléphone, déclenchés uniquement par une commande de l'utilisateur. */
          @CapacitorPlugin(name = "LisaPhone", permissions = {@Permission(strings = {android.Manifest.permission.READ_CONTACTS}, alias = "contacts")})
          public class LisaPhone extends Plugin {
              private Context ctx() { return getContext(); }
              private void launch(Intent i) { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); ctx().startActivity(i); }
              private int pct(PluginCall c) { return Math.max(0, Math.min(100, c.getInt("level", 50))); }

              @PluginMethod public void volume(PluginCall c) {
                  AudioManager am = (AudioManager) ctx().getSystemService(Context.AUDIO_SERVICE);
                  int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                  am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.round(max * pct(c) / 100f), AudioManager.FLAG_SHOW_UI);
                  c.resolve();
              }

              @PluginMethod public void brightness(PluginCall c) {
                  if (!Settings.System.canWrite(ctx())) {
                      launch(new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + ctx().getPackageName())));
                      c.reject("permission"); return;
                  }
                  ContentResolver cr = ctx().getContentResolver();
                  Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL);
                  Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS, Math.round(255 * pct(c) / 100f));
                  c.resolve();
              }

              @PluginMethod public void torch(PluginCall c) {
                  try {
                      CameraManager cm = (CameraManager) ctx().getSystemService(Context.CAMERA_SERVICE);
                      for (String id : cm.getCameraIdList()) {
                          CameraCharacteristics ch = cm.getCameraCharacteristics(id);
                          Boolean flash = ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                          Integer face = ch.get(CameraCharacteristics.LENS_FACING);
                          if (Boolean.TRUE.equals(flash) && face != null && face == CameraCharacteristics.LENS_FACING_BACK) {
                              cm.setTorchMode(id, c.getBoolean("on", true)); c.resolve(); return;
                          }
                      }
                      c.reject("no flash");
                  } catch (Exception e) { c.reject(e.getMessage()); }
              }

              @PluginMethod public void dnd(PluginCall c) {
                  NotificationManager nm = (NotificationManager) ctx().getSystemService(Context.NOTIFICATION_SERVICE);
                  if (!nm.isNotificationPolicyAccessGranted()) {
                      launch(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                      c.reject("permission"); return;
                  }
                  nm.setInterruptionFilter(c.getBoolean("on", true) ? NotificationManager.INTERRUPTION_FILTER_NONE : NotificationManager.INTERRUPTION_FILTER_ALL);
                  c.resolve();
              }


              @PluginMethod public void alarm(PluginCall c) {
                  Intent i = new Intent(AlarmClock.ACTION_SET_ALARM).putExtra(AlarmClock.EXTRA_HOUR, c.getInt("h", 7)).putExtra(AlarmClock.EXTRA_MINUTES, c.getInt("m", 0)).putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                  launch(i); c.resolve();
              }

              @PluginMethod public void timer(PluginCall c) {
                  Intent i = new Intent(AlarmClock.ACTION_SET_TIMER).putExtra(AlarmClock.EXTRA_LENGTH, c.getInt("seconds", 60)).putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                  launch(i); c.resolve();
              }

              @PluginMethod public void call(PluginCall c) {
                  if (ContextCompat.checkSelfPermission(ctx(), android.Manifest.permission.READ_CONTACTS) != android.content.pm.PackageManager.PERMISSION_GRANTED) { requestPermissionForAlias("contacts", c, "callPerm"); return; }
                  doCall(c);
              }

              @PermissionCallback private void callPerm(PluginCall c) {
                  if (ContextCompat.checkSelfPermission(ctx(), android.Manifest.permission.READ_CONTACTS) == android.content.pm.PackageManager.PERMISSION_GRANTED) doCall(c); else c.reject("permission");
              }

              /** Cherche le contact et ouvre le composeur : l'utilisateur touche lui-même le bouton d'appel. */
              private void doCall(PluginCall c) {
                  String name = c.getString("name", "");
                  try (Cursor q = ctx().getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER},
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?", new String[]{"%" + name + "%"}, null)) {
                      if (q != null && q.moveToFirst()) {
                          JSObject o = new JSObject(); o.put("name", q.getString(0));
                          launch(new Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(q.getString(1)))));
                          c.resolve(o); return;
                      }
                  } catch (Exception e) { c.reject(String.valueOf(e.getMessage())); return; }
                  c.reject("introuvable");
              }

              @PluginMethod public void open(PluginCall c) {
                  String a;
                  switch (c.getString("page", "main")) {
                      case "wifi": a = Settings.ACTION_WIFI_SETTINGS; break;
                      case "bluetooth": a = Settings.ACTION_BLUETOOTH_SETTINGS; break;
                      case "display": a = Settings.ACTION_DISPLAY_SETTINGS; break;
                      case "sound": a = Settings.ACTION_SOUND_SETTINGS; break;
                      case "battery": a = Settings.ACTION_BATTERY_SAVER_SETTINGS; break;
                      default: a = Settings.ACTION_SETTINGS;
                  }
                  launch(new Intent(a)); c.resolve();
              }
          }
          EOF_PHONE
          mkdir -p $(dirname android/app/src/main/java/com/leonard/lisa/MainActivity.java)
          cat > android/app/src/main/java/com/leonard/lisa/MainActivity.java <<'EOF_MAIN'
          package com.leonard.lisa;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(LisaBridge.class);
                  registerPlugin(LisaPhone.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF_MAIN
          mkdir -p $(dirname /tmp/patch_manifest.py)
          cat > /tmp/patch_manifest.py <<'EOF_PATCH'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = '<uses-permission android:name="android.permission.READ_CALL_LOG" />\n    <uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.WRITE_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    '
          svc = '<service android:name=".LisaNotifService" android:exported="false" android:label="Lisa" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter></service>\n    '
          s = s.replace("<application", perms + "<application", 1)
          s = s.replace("</application>", svc + "</application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          EOF_PATCH
      - name: Ajouter l'IA locale (bloc à retirer en entier si le build échoue)
        run: |
          cat > android/app/src/main/java/com/leonard/lisa/LisaLocalAI.java <<'EOF_LOCAL'
          package com.leonard.lisa;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.mediapipe.tasks.genai.llminference.LlmInference;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          /** IA locale : modèle Gemma .task copié dans le stockage privé de l'app, aucune donnée ne sort du téléphone. */
          @CapacitorPlugin(name = "LisaLocalAI")
          public class LisaLocalAI extends Plugin {
              private LlmInference llm;

              private File model() { return new File(getContext().getFilesDir(), "model.task"); }

              private JSObject st() {
                  File f = model();
                  JSObject o = new JSObject();
                  o.put("ready", f.exists() && f.length() > 100000000L);
                  o.put("mb", f.exists() ? f.length() / 1048576L : 0);
                  return o;
              }

              private synchronized void closeLlm() { if (llm != null) { llm.close(); llm = null; } }

              @PluginMethod public void status(PluginCall c) { c.resolve(st()); }

              @PluginMethod public void pickModel(PluginCall c) {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(c, i, "picked");
              }

              @ActivityCallback private void picked(PluginCall c, ActivityResult r) {
                  if (c == null) return;
                  if (r.getResultCode() != Activity.RESULT_OK || r.getData() == null || r.getData().getData() == null) { c.reject("annule"); return; }
                  final Uri u = r.getData().getData();
                  new Thread(() -> {
                      try {
                          closeLlm();
                          try (InputStream in = getContext().getContentResolver().openInputStream(u); OutputStream out = new FileOutputStream(model())) {
                              byte[] b = new byte[1 << 16]; int n;
                              while ((n = in.read(b)) > 0) out.write(b, 0, n);
                          }
                          c.resolve(st());
                      } catch (Exception e) { model().delete(); c.reject(String.valueOf(e.getMessage())); }
                  }).start();
              }

              @PluginMethod public void generate(PluginCall c) {
                  final String p = c.getString("prompt", "");
                  if (p.isEmpty() || !model().exists()) { c.reject("modele absent"); return; }
                  new Thread(() -> {
                      try {
                          synchronized (this) {
                              if (llm == null) {
                                  LlmInference.LlmInferenceOptions o = LlmInference.LlmInferenceOptions.builder()
                                      .setModelPath(model().getAbsolutePath()).setMaxTokens(1536).build();
                                  llm = LlmInference.createFromOptions(getContext(), o);
                              }
                              JSObject out = new JSObject();
                              out.put("text", llm.generateResponse(p));
                              c.resolve(out);
                          }
                      } catch (Throwable e) { c.reject(String.valueOf(e.getMessage())); }
                  }).start();
              }

              @PluginMethod public void unload(PluginCall c) { closeLlm(); c.resolve(); }
          }
          EOF_LOCAL
          python3 - <<'EOF_PY'
          import re
          g = "android/variables.gradle"
          s = open(g, encoding="utf-8").read()
          s = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 24", s)
          open(g, "w", encoding="utf-8").write(s)
          g = "android/app/build.gradle"
          s = open(g, encoding="utf-8").read()
          s = s.replace("dependencies {", "dependencies {\n    implementation 'com.google.mediapipe:tasks-genai:0.10.27'", 1)
          open(g, "w", encoding="utf-8").write(s)
          m = "android/app/src/main/java/com/leonard/lisa/MainActivity.java"
          s = open(m, encoding="utf-8").read()
          s = s.replace("registerPlugin(LisaPhone.class);", "registerPlugin(LisaPhone.class);\n        registerPlugin(LisaLocalAI.class);", 1)
          open(m, "w", encoding="utf-8").write(s)
          a = "android/app/src/main/AndroidManifest.xml"
          s = open(a, encoding="utf-8").read()
          s = s.replace("</application>", '<uses-native-library android:name="libOpenCL.so" android:required="false"/>\n    </application>', 1)
          open(a, "w", encoding="utf-8").write(s)
          EOF_PY
      - name: Compiler l'APK
        run: |
          python3 /tmp/patch_manifest.py
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Lisa.apk
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Lisa APK ${{ github.run_number }}
          files: Lisa.apk
